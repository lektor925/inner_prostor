<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <title>{% block title %}Справочник номенклатуры{% endblock %}</title>
</head>
<body>
    <nav class="site-nav">
        <a href="{% url 'catalog:nomenclature_list' %}">Поиск</a>
        {% if user.is_authenticated %}
        <a href="{% url 'catalog:request_list' %}">Заявки</a>
        <a href="{% url 'catalog:request_create' %}">Новая заявка</a>
        <form method="post" action="{% url 'logout' %}" class="site-nav__logout">
            {% csrf_token %}
            <button type="submit">Выйти ({{ user }})</button>
        </form>
        {% else %}
        <a href="{% url 'login' %}">Войти</a>
        {% endif %}
    </nav>
    {% block content %}{% endblock %}
</body>
</html>
